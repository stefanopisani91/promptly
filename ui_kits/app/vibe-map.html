<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promptly — Vibe Map</title>
<link rel="icon" href="../../assets/logo-favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; }
  * { box-sizing: border-box; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--primary-deep); outline-offset: 2px; }
  @media (max-width: 640px) {
    .promptly-sidebar { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="VibeMap.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showHeader": true,
  "trailStyle": "dashed",
  "biomeHeight": 290
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [toast, setToast] = React.useState(null);

  return (
    <div style={{display: 'flex', minHeight: '100vh', background: 'var(--background)'}} data-screen-label="Vibe map">
      <Sidebar active="dashboard" onNav={() => {}}/>
      <div style={{flex: 1, minWidth: 0}}>
        {tweaks.showHeader && <TopBar title="Welcome back, Stefano." subtitle="VENERDÌ · 1 MAGGIO"/>}
        <VibeMap tweaks={tweaks} onLesson={l => {
          setToast(`Opening "${l.title}"…`);
          setTimeout(() => setToast(null), 1800);
        }}/>
      </div>
      {toast && (
        <div style={{position: 'fixed', bottom: 28, left: '50%', transform: 'translateX(-50%)', background: 'var(--text-primary)', color: '#fff', padding: '10px 18px', borderRadius: 9999, fontSize: 13, fontWeight: 600, boxShadow: 'var(--shadow-lg)', zIndex: 100}}>
          {toast}
        </div>
      )}
      <TweaksPanel title="Tweaks">
        <TweakSection title="Layout">
          <TweakToggle label="Show top bar" value={tweaks.showHeader} onChange={v => setTweak('showHeader', v)}/>
          <TweakSlider label="Biome height" value={tweaks.biomeHeight} onChange={v => setTweak('biomeHeight', v)} min={220} max={360} step={10}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
