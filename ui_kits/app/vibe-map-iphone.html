<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promptly — Vibe Map (iPhone)</title>
<link rel="icon" href="../../assets/logo-favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; background: #f0eee8; }
  * { box-sizing: border-box; }
  button:focus-visible { outline: 2px solid var(--primary-deep); outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="MobileVibeMap.jsx"></script>
<script type="text/babel">
function App() {
  const [toast, setToast] = React.useState(null);
  return (
    <div style={{minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px', background: 'radial-gradient(circle at 30% 20%, #fff1eb 0%, #f0eee8 70%)'}} data-screen-label="Mobile vibe map">
      <IOSDevice>
        <div style={{display: 'flex', flexDirection: 'column', height: '100%', background: 'var(--background)'}}>
          <MobileTopBar/>
          <MobileVibeMap onLesson={l => { setToast(`Apertura "${l.title}"…`); setTimeout(() => setToast(null), 1600); }}/>
          <MobileTabBar active="map"/>
        </div>
        {toast && <div style={{position: 'absolute', bottom: 100, left: '50%', transform: 'translateX(-50%)', background: 'var(--text-primary)', color: '#fff', padding: '9px 16px', borderRadius: 9999, fontSize: 12, fontWeight: 600, boxShadow: 'var(--shadow-lg)', zIndex: 100, whiteSpace: 'nowrap'}}>{toast}</div>}
      </IOSDevice>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
