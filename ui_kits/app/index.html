<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promptly — App</title>
<link rel="icon" href="../../assets/logo-favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; }
  * { box-sizing: border-box; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--primary-deep); outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="PathOverview.jsx"></script>
<script type="text/babel" src="LessonPlayer.jsx"></script>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState('dashboard');
  const meta = {
    dashboard: {title: 'Welcome back, Stefano.', subtitle: 'TUESDAY · 28 APRIL'},
    path:      {title: 'The Prompt',                subtitle: 'PATH 2 OF 5'},
    lesson:    {title: 'Anatomy of a prompt',       subtitle: 'LESSON 04 · ~8 MIN'},
  };
  const m = meta[screen] || meta.dashboard;
  return (
    <div style={{display: 'flex', minHeight: '100vh', background: 'var(--background)'}} data-screen-label={`App · ${screen}`}>
      <Sidebar active={screen === 'lesson' ? 'path' : screen === 'path' ? 'path' : 'dashboard'} onNav={(id) => setScreen(id === 'path' ? 'path' : 'dashboard')}/>
      <div style={{flex: 1, minWidth: 0}}>
        <TopBar title={m.title} subtitle={m.subtitle}/>
        {screen === 'dashboard' && <Dashboard onContinue={() => setScreen('lesson')} onPath={() => setScreen('path')}/>}
        {screen === 'path' && <PathOverview onLesson={() => setScreen('lesson')}/>}
        {screen === 'lesson' && <LessonPlayer onComplete={() => setScreen('path')}/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
