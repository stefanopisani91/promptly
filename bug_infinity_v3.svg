<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <!-- V3: GRADIENT + SHADOW — sfondo lavanda, infinito con gradient viola 3D e ombra -->

  <defs>
    <!-- Gradient per l'infinito -->
    <linearGradient id="infinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B14C4"/>
      <stop offset="50%" stop-color="#C040D0"/>
      <stop offset="100%" stop-color="#8B22CC"/>
    </linearGradient>
    <!-- Highlight per effetto 3D -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E880F5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E880F5" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="12" flood-color="#7B14C4" flood-opacity="0.35"/>
    </filter>
    <!-- Soft glow per il bug -->
    <filter id="bugGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background sfumato -->
  <rect width="500" height="500" fill="#F0E8FC" rx="28"/>
  <rect width="500" height="500" fill="url(#highlightGrad)" rx="28" opacity="0.3"/>

  <!-- Ombra dell'infinito (separata, leggermente shiftata) -->
  <g transform="rotate(45, 255, 258)" opacity="0.3">
    <path d="M 90,250 C 90,188 216,188 250,250 C 284,312 410,312 410,250 C 410,188 284,188 250,250 C 216,312 90,312 90,250 Z"
          fill="#5A0A9C"/>
  </g>

  <!-- Infinity symbol con gradient -->
  <g transform="rotate(45, 250, 250)" filter="url(#dropShadow)">
    <path d="M 90,250 C 90,188 216,188 250,250 C 284,312 410,312 410,250 C 410,188 284,188 250,250 C 216,312 90,312 90,250 Z"
          fill="url(#infinityGrad)"/>
    <!-- Highlight interno (effetto 3D) -->
    <path d="M 100,250 C 100,200 218,200 250,250 C 216,200 100,200 100,250 Z"
          fill="url(#highlightGrad)" opacity="0.4"/>
    <path d="M 400,250 C 400,200 282,200 250,250 C 282,200 400,200 400,250 Z"
          fill="url(#highlightGrad)" opacity="0.4"/>
    <!-- Bordo scuro sottile -->
    <path d="M 90,250 C 90,188 216,188 250,250 C 284,312 410,312 410,250 C 410,188 284,188 250,250 C 216,312 90,312 90,250 Z"
          fill="none"
          stroke="#5A0A9C"
          stroke-width="2"
          opacity="0.5"/>
  </g>

  <!-- Label -->
  <text x="250" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#7B3EA8" letter-spacing="2">VARIANT 3 — GRADIENT + SHADOW</text>

  <!-- BUG — con ombra leggera e dettagli -->
  <g>
    <!-- Ombra bug -->
    <ellipse cx="254" cy="270" rx="18" ry="8" fill="#5A0A9C" opacity="0.2"/>

    <!-- Elytra sinistra con riflesso -->
    <ellipse cx="241" cy="254" rx="12" ry="21" fill="#111" transform="rotate(-8, 241, 254)"/>
    <ellipse cx="239" cy="247" rx="5" ry="8" fill="#333" opacity="0.5" transform="rotate(-8, 239, 247)"/>

    <!-- Elytra destra con riflesso -->
    <ellipse cx="259" cy="254" rx="12" ry="21" fill="#111" transform="rotate(8, 259, 254)"/>
    <ellipse cx="257" cy="247" rx="5" ry="8" fill="#333" opacity="0.5" transform="rotate(8, 257, 247)"/>

    <!-- Linea sutura -->
    <line x1="250" y1="235" x2="250" y2="277" stroke="#2a2a2a" stroke-width="1.5"/>

    <!-- Testa con riflesso -->
    <circle cx="250" cy="228" r="13" fill="#111"/>
    <ellipse cx="246" cy="223" rx="5" ry="4" fill="#333" opacity="0.5"/>

    <!-- Occhi -->
    <circle cx="244" cy="226" r="4" fill="#F8F4FF"/>
    <circle cx="256" cy="226" r="4" fill="#F8F4FF"/>
    <circle cx="244.5" cy="226.5" r="1.8" fill="#0D0D0D"/>
    <circle cx="256.5" cy="226.5" r="1.8" fill="#0D0D0D"/>
    <!-- Punto luce negli occhi -->
    <circle cx="243.5" cy="225.5" r="0.8" fill="white"/>
    <circle cx="255.5" cy="225.5" r="0.8" fill="white"/>

    <!-- Antenne -->
    <path d="M 244,217 Q 233,203 225,195" stroke="#111" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="224" cy="194" r="3.5" fill="#111"/>
    <path d="M 256,217 Q 267,203 275,195" stroke="#111" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="276" cy="194" r="3.5" fill="#111"/>

    <!-- Zampe (con piccola curva al piede) -->
    <path d="M 231,247 L 208,238" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 231,256 L 206,256" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 231,266 L 210,276" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 269,247 L 292,238" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 269,256 L 294,256" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 269,266 L 290,276" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
