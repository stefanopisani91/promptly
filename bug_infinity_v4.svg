<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <!-- V4: NEON DARK — sfondo scuro, infinito neon viola glowing, bug in bianco -->

  <defs>
    <!-- Glow per l'infinito neon -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Glow sottile per il bug -->
    <filter id="bugNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient neon -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E040FB"/>
      <stop offset="50%" stop-color="#CE35E8"/>
      <stop offset="100%" stop-color="#9B00FF"/>
    </linearGradient>
  </defs>

  <!-- Background scuro con sfumatura subtile -->
  <rect width="500" height="500" fill="#0E0520" rx="28"/>
  <!-- Bagliore ambientale sfondo -->
  <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#4A0080" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#0E0520" stop-opacity="0"/>
  </radialGradient>
  <rect width="500" height="500" fill="url(#ambientGlow)" rx="28"/>

  <!-- Infinity — strato glow esterno (larghissimo) -->
  <g transform="rotate(45, 250, 250)" opacity="0.25">
    <path d="M 90,250 C 90,188 216,188 250,250 C 284,312 410,312 410,250 C 410,188 284,188 250,250 C 216,312 90,312 90,250 Z"
          fill="none" stroke="#D040E0" stroke-width="50"/>
  </g>

  <!-- Infinity — strato glow medio -->
  <g transform="rotate(45, 250, 250)" opacity="0.5">
    <path d="M 90,250 C 90,188 216,188 250,250 C 284,312 410,312 410,250 C 410,188 284,188 250,250 C 216,312 90,312 90,250 Z"
          fill="none" stroke="#D040E0" stroke-width="20"/>
  </g>

  <!-- Infinity — stroke principale neon -->
  <g transform="rotate(45, 250, 250)" filter="url(#neonGlow)">
    <path d="M 90,250 C 90,188 216,188 250,250 C 284,312 410,312 410,250 C 410,188 284,188 250,250 C 216,312 90,312 90,250 Z"
          fill="none" stroke="url(#neonGrad)" stroke-width="10" stroke-linejoin="round"/>
    <!-- Core bianco (effetto neon reale) -->
    <path d="M 90,250 C 90,188 216,188 250,250 C 284,312 410,312 410,250 C 410,188 284,188 250,250 C 216,312 90,312 90,250 Z"
          fill="none" stroke="#F0AAFF" stroke-width="3" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- Label -->
  <text x="250" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#C060D8" letter-spacing="2">VARIANT 4 — NEON DARK</text>

  <!-- BUG — bianco/luminoso per contrasto su sfondo scuro -->
  <g filter="url(#bugNeonGlow)">
    <!-- Elytra sinistra -->
    <ellipse cx="241" cy="254" rx="12" ry="21" fill="#D8B8F0" transform="rotate(-8, 241, 254)"/>
    <ellipse cx="241" cy="254" rx="12" ry="21" fill="none" stroke="#F0AAFF" stroke-width="1.2" transform="rotate(-8, 241, 254)"/>

    <!-- Elytra destra -->
    <ellipse cx="259" cy="254" rx="12" ry="21" fill="#D8B8F0" transform="rotate(8, 259, 254)"/>
    <ellipse cx="259" cy="254" rx="12" ry="21" fill="none" stroke="#F0AAFF" stroke-width="1.2" transform="rotate(8, 259, 254)"/>

    <!-- Linea centrale -->
    <line x1="250" y1="235" x2="250" y2="277" stroke="#9B40CC" stroke-width="1.5"/>

    <!-- Testa -->
    <circle cx="250" cy="228" r="13" fill="#D8B8F0"/>
    <circle cx="250" cy="228" r="13" fill="none" stroke="#F0AAFF" stroke-width="1.2"/>

    <!-- Occhi (neon) -->
    <circle cx="244" cy="226" r="4" fill="#9B00FF"/>
    <circle cx="256" cy="226" r="4" fill="#9B00FF"/>
    <circle cx="244" cy="226" r="2" fill="#F0AAFF"/>
    <circle cx="256" cy="226" r="2" fill="#F0AAFF"/>

    <!-- Antenne -->
    <path d="M 244,217 Q 233,203 225,195" stroke="#F0AAFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="224" cy="194" r="3.5" fill="#E040FB"/>
    <path d="M 256,217 Q 267,203 275,195" stroke="#F0AAFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="276" cy="194" r="3.5" fill="#E040FB"/>

    <!-- Zampe luminose -->
    <path d="M 231,247 L 207,238" stroke="#C890E8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 231,256 L 206,256" stroke="#C890E8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 231,266 L 209,276" stroke="#C890E8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 269,247 L 293,238" stroke="#C890E8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 269,256 L 294,256" stroke="#C890E8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 269,266 L 291,276" stroke="#C890E8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Particelle/stelle decorative -->
  <circle cx="80" cy="80" r="1.5" fill="#E040FB" opacity="0.7"/>
  <circle cx="420" cy="100" r="1" fill="#F0AAFF" opacity="0.5"/>
  <circle cx="60" cy="380" r="1" fill="#C890E8" opacity="0.6"/>
  <circle cx="440" cy="360" r="1.5" fill="#E040FB" opacity="0.4"/>
  <circle cx="150" cy="440" r="1" fill="#F0AAFF" opacity="0.5"/>
  <circle cx="360" cy="430" r="1" fill="#C890E8" opacity="0.6"/>
  <circle cx="100" cy="200" r="1" fill="#E040FB" opacity="0.4"/>
  <circle cx="400" cy="280" r="1.5" fill="#F0AAFF" opacity="0.3"/>
</svg>
