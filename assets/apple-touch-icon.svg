    <!-- P body (white) -->
    <path d="M 50 50 Q 50 25 75 25 L 130 25 Q 175 25 175 85 Q 175 145 130 145 L 108 145 L 108 175 Q 108 185 98 185 L 65 185 Q 50 185 50 165 Z" fill="white"/>
    <!-- Brain (orange) -->
    <g transform="translate(123, 85)">
      <path d="M 0 -28 Q -12 -30 -22 -22 Q -30 -14 -28 -2 Q -34 4 -30 12 Q -28 22 -18 26 Q -10 30 0 28 Q 8 30 16 26 Q 26 22 28 12 Q 32 4 26 -2 Q 28 -14 18 -22 Q 8 -30 0 -28 Z" fill="#E8703F"/>
      <g stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 0 -24 Q 2 -14 -2 -6 Q 2 2 0 24"/>
        <path d="M 7 18 Q 14 24 22 18" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
