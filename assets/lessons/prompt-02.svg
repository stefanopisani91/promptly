<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Lesson: Give the AI a role — name badge / role tag -->
  <rect x="12" y="10" width="40" height="32" rx="4" fill="#FFF1EB" stroke="#E8703F" stroke-width="2"/>
  <!-- "ROLE:" label -->
  <rect x="18" y="16" width="28" height="6" rx="1" fill="none" stroke="#E8703F" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <line x1="22" y1="19" x2="42" y2="19" stroke="#E8703F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- emphasized role line -->
  <rect x="18" y="26" width="28" height="8" rx="2" fill="#E8703F"/>
  <line x1="22" y1="30" x2="42" y2="30" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Lanyard/holder -->
  <line x1="32" y1="42" x2="32" y2="52" stroke="#E8703F" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="32" cy="55" rx="14" ry="3" fill="#E8703F"/>
</svg>
