<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Lesson: The version problem — clock with knowledge cutoff warning marker -->
  <circle cx="32" cy="32" r="22" fill="#FFF1EB" stroke="#E8703F" stroke-width="2"/>
  <!-- Hour markers -->
  <line x1="32" y1="14" x2="32" y2="17" stroke="#E8703F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="50" stroke="#E8703F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="32" x2="17" y2="32" stroke="#E8703F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="47" y1="32" x2="50" y2="32" stroke="#E8703F" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hands -->
  <line x1="32" y1="32" x2="32" y2="20" stroke="#E8703F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="42" y2="32" stroke="#E8703F" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2" fill="#E8703F"/>
  <!-- Cutoff warning marker -->
  <circle cx="48" cy="18" r="6.5" fill="#E8703F" stroke="white" stroke-width="1.5"/>
  <text x="48" y="21.5" font-family="sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">!</text>
</svg>
