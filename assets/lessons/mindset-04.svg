<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Lesson: Break it down — one big block becomes 3 small blocks -->
  <rect x="6" y="20" width="20" height="24" rx="2" fill="#FFF1EB" stroke="#E8703F" stroke-width="2"/>
  <!-- Arrow -->
  <line x1="30" y1="32" x2="38" y2="32" stroke="#E8703F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 35 28 L 39 32 L 35 36" stroke="#E8703F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Three small blocks -->
  <rect x="42" y="14" width="16" height="11" rx="2" fill="#E8703F"/>
  <rect x="42" y="27" width="16" height="11" rx="2" fill="#FFF1EB" stroke="#E8703F" stroke-width="2"/>
  <rect x="42" y="40" width="16" height="11" rx="2" fill="#FFF1EB" stroke="#E8703F" stroke-width="2"/>
</svg>
