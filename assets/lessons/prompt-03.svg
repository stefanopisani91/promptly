<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Lesson: Constraints are your friends — fence/boundary protecting a small element -->
  <rect x="8" y="20" width="48" height="32" rx="3" fill="none" stroke="#E8703F" stroke-width="2.5"/>
  <!-- Vertical fence posts -->
  <line x1="20" y1="14" x2="20" y2="52" stroke="#E8703F" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="32" y2="52" stroke="#E8703F" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="14" x2="44" y2="52" stroke="#E8703F" stroke-width="2" stroke-linecap="round"/>
  <!-- Horizontal rails -->
  <line x1="14" y1="22" x2="50" y2="22" stroke="#E8703F" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="40" x2="50" y2="40" stroke="#E8703F" stroke-width="2" stroke-linecap="round"/>
  <!-- Small protected element inside -->
  <circle cx="32" cy="32" r="4" fill="#E8703F"/>
</svg>
