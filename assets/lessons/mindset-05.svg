<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Lesson: Context is everything — outer frame surrounds the inner subject -->
  <rect x="6" y="6" width="52" height="52" rx="4" fill="none" stroke="#E8703F" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Corner brackets emphasizing the frame -->
  <path d="M 6 14 L 6 6 L 14 6" stroke="#E8703F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 50 6 L 58 6 L 58 14" stroke="#E8703F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 58 50 L 58 58 L 50 58" stroke="#E8703F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 14 58 L 6 58 L 6 50" stroke="#E8703F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Inner subject -->
  <rect x="20" y="20" width="24" height="24" rx="3" fill="#FFF1EB" stroke="#E8703F" stroke-width="2"/>
  <circle cx="32" cy="32" r="6" fill="#E8703F"/>
</svg>
