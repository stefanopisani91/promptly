<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <!-- V1: FLAT BOLD — sfondo bianco, infinito viola solido, bug nero piatto -->

  <!-- Background -->
  <rect width="500" height="500" fill="#F8F4FF" rx="28"/>

  <!-- Infinity symbol — ruotato 45° attorno al centro -->
  <g transform="rotate(45, 250, 250)">
    <path d="M 90,250 C 90,188 216,188 250,250 C 284,312 410,312 410,250 C 410,188 284,188 250,250 C 216,312 90,312 90,250 Z"
          fill="#B02EC9"/>
  </g>

  <!-- Label -->
  <text x="250" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#9B5EAA" letter-spacing="2">VARIANT 1 — FLAT BOLD</text>

  <!-- BUG — centrato sul crossing point (250,250) -->
  <g>
    <!-- Elytra sinistra -->
    <ellipse cx="241" cy="254" rx="12" ry="21" fill="#0D0D0D" transform="rotate(-8, 241, 254)"/>
    <!-- Elytra destra -->
    <ellipse cx="259" cy="254" rx="12" ry="21" fill="#0D0D0D" transform="rotate(8, 259, 254)"/>
    <!-- Linea centrale corpo -->
    <line x1="250" y1="235" x2="250" y2="277" stroke="#2a2a2a" stroke-width="1.5"/>
    <!-- Testa -->
    <circle cx="250" cy="228" r="13" fill="#0D0D0D"/>
    <!-- Occhi -->
    <circle cx="244" cy="226" r="3.5" fill="white"/>
    <circle cx="256" cy="226" r="3.5" fill="white"/>
    <circle cx="244.8" cy="226.8" r="1.4" fill="#0D0D0D"/>
    <circle cx="256.8" cy="226.8" r="1.4" fill="#0D0D0D"/>
    <!-- Antenne -->
    <path d="M 244,217 Q 234,204 226,196" stroke="#0D0D0D" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="225" cy="195" r="3" fill="#0D0D0D"/>
    <path d="M 256,217 Q 266,204 274,196" stroke="#0D0D0D" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="275" cy="195" r="3" fill="#0D0D0D"/>
    <!-- Zampe sinistre -->
    <path d="M 232,246 L 208,237" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/>
    <path d="M 231,256 L 206,256" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/>
    <path d="M 232,266 L 210,276" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/>
    <!-- Zampe destre -->
    <path d="M 268,246 L 292,237" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/>
    <path d="M 269,256 L 294,256" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/>
    <path d="M 268,266 L 290,276" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
